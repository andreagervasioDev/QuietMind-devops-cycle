# Configurazione nginx per la SPA Quiet Mind.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compressione per asset testuali.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    # Header di sicurezza di base.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Endpoint usato dall'HEALTHCHECK dell'immagine.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # Proxy verso il backend del docker-compose. Il resolver interno di Docker
    # risolve "backend" a runtime, così nginx parte anche se il backend non è ancora su.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $backend "http://backend:3001";
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Asset con hash nel nome: cache lunga.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Fallback SPA: ogni rotta sconosciuta serve index.html (React Router gestisce il resto).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
