# Pipeline CI/CD di Quiet Mind.
#
#   push su develop / pull request  -> CI (lint, typecheck, build, immagine Docker) + staging
#   push su main                    -> CI + deploy automatico su GitHub Pages (production)
#
# Nessun job di deploy parte se lint o build falliscono: il job "deploy" dichiara
# `needs` verso tutti i job di CI, quindi un lint rosso blocca la produzione.
name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Un solo run per branch alla volta: un push nuovo annulla quello precedente ancora in coda.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 22

jobs:
  # ---------------------------------------------------------------- CI
  lint:
    name: Lint (oxlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # oxlint esce con codice != 0 se trova errori: il job diventa rosso e blocca il resto.
      - run: npm run lint

  build:
    name: Typecheck + build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      # Verifica che i secret siano configurati ma NON stampati: GitHub li maschera con ***,
      # qui mostriamo solo la lunghezza, a riprova che il valore non compare nei log.
      - name: Check secrets are set (masked)
        env:
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
        run: |
          if [ -z "$VITE_SENTRY_DSN" ]; then
            echo "::warning::VITE_SENTRY_DSN non configurato: la build non includerà Sentry"
          else
            echo "VITE_SENTRY_DSN configurato (lunghezza: ${#VITE_SENTRY_DSN} caratteri)"
          fi

      - name: Build (production)
        env:
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_APP_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
          VITE_APP_VERSION: ${{ github.sha }}
          # Su GitHub Pages il sito vive in https://<owner>.github.io/<repo>/
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Prepare SPA fallback for GitHub Pages
        run: |
          cp dist/index.html dist/404.html   # rotte client-side (es. /learn) ricaricate direttamente
          touch dist/.nojekyll               # disattiva Jekyll, che ignorerebbe i file con underscore

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  docker:
    name: Build immagine Docker
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # GHCR accetta solo nomi in minuscolo (l'owner del repo contiene maiuscole).
      - name: Compute image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/quiet-mind" >> "$GITHUB_ENV"

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_APP_VERSION=${{ github.sha }}

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          load: true
          tags: ${{ env.IMAGE_NAME }}-api:${{ github.sha }}

      # Smoke test: l'immagine deve partire e rispondere al healthcheck.
      - name: Smoke test containers
        run: |
          docker run -d --name web -p 8080:80 ${IMAGE_NAME}:${{ github.sha }}
          docker run -d --name api -p 3001:3001 ${IMAGE_NAME}-api:${{ github.sha }}
          sleep 5
          curl --fail --silent http://localhost:8080/healthz
          curl --fail --silent http://localhost:8080/ | grep -q '<div id="root">'
          curl --fail --silent http://localhost:3001/api/health
          docker rm -f web api

      # Le immagini vengono pubblicate su GitHub Container Registry solo per i push
      # (non per le PR): "staging" per develop, "latest" per main.
      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push images
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref == 'refs/heads/main' && 'latest' || 'staging' }}
        run: |
          for img in "${IMAGE_NAME}" "${IMAGE_NAME}-api"; do
            docker tag "$img:${{ github.sha }}" "$img:${TAG}"
            docker push "$img:${{ github.sha }}"
            docker push "$img:${TAG}"
          done

  audit:
    name: npm audit (informativo)
    runs-on: ubuntu-latest
    needs: lint
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high

  # ---------------------------------------------------------------- CD
  deploy:
    name: Deploy production (GitHub Pages)
    # Solo push su main, e solo se lint + build + docker sono verdi.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, build, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4

      # Pages può impiegare qualche secondo a propagare: fino a 6 tentativi a distanza di 10s.
      - name: Verify public URL
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          for i in $(seq 1 6); do
            code=$(curl --silent -o /dev/null -w "%{http_code}" "$url")
            echo "Tentativo $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::$url non risponde 200"
          exit 1
